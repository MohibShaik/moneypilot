spring:
  application:
    name: MoneyPilot

  datasource:
    url: ${MONEYPILOT_DB_URL:jdbc:postgresql://localhost:5432/moneypilot}
    username: ${MONEYPILOT_DB_USERNAME:moneypilot}
    password: ${MONEYPILOT_DB_PASSWORD:moneypilot_local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # The database is the source of truth. Hibernate must only validate the
      # schema managed by Flyway, never create or alter tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# JWT configuration. The secret MUST be supplied via the environment in any
# real deployment (never commit a production secret). The local default below is
# a development-only placeholder, long enough to satisfy the HS256 key-length
# requirement so the app can start locally without extra setup.
moneypilot:
  jwt:
    secret: ${MONEYPILOT_JWT_SECRET:local-dev-only-insecure-secret-change-me-0123456789}
    ttl: ${MONEYPILOT_JWT_TTL:PT15M}
    issuer: ${MONEYPILOT_JWT_ISSUER:moneypilot}
  # CORS allowed origins (comma-separated). Default "*" allows any origin; this
  # is safe for a stateless Bearer-token API (no cookies). Tighten in prod by
  # setting MONEYPILOT_CORS_ALLOWED_ORIGINS to specific web origins.
  cors:
    allowed-origins: ${MONEYPILOT_CORS_ALLOWED_ORIGINS:*}

# OpenAPI / Swagger UI (springdoc). The spec is at /v3/api-docs and the UI at
# /swagger-ui.html. Operations are sorted and grouped for readability.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
