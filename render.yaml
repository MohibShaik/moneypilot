# Render Blueprint for the MoneyPilot backend.
#
# Deploys the Spring Boot API as a Dockerized free web service. The database is
# NOT defined here: it lives on Neon (persistent free Postgres), wired via the
# environment variables below. Set the secret values in the Render dashboard
# (or mark sync:false and fill them in on first deploy) — never commit secrets.
#
# See DEPLOYMENT.md for the full step-by-step runbook.

services:
  - type: web
    name: moneypilot-backend
    runtime: docker
    plan: free
    # The Dockerfile and build context live in the backend/ subdirectory.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Neon Postgres connection. Set these in the dashboard from your Neon
      # connection string (JDBC form). Keep sslmode=require for Neon.
      - key: MONEYPILOT_DB_URL
        sync: false
      - key: MONEYPILOT_DB_USERNAME
        sync: false
      - key: MONEYPILOT_DB_PASSWORD
        sync: false
      # JWT signing secret (HS256). Render can generate a strong value.
      - key: MONEYPILOT_JWT_SECRET
        generateValue: true
      # Optional overrides (sensible defaults exist in application.yml):
      # - key: MONEYPILOT_JWT_TTL           # e.g. PT15M
      # - key: MONEYPILOT_CORS_ALLOWED_ORIGINS  # e.g. https://app.example.com
      #
      # PORT is injected by Render automatically; the app binds to it.
